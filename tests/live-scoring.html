<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live scoring test fixture</title>
<link rel="stylesheet" href="../style.css?v=game-editor-1">
<body>
<button id="open" type="button">Open test scoreboard</button>
<button id="history" type="button">Score history</button>
<output id="result" aria-live="polite"></output>
<script type="module">
import { openScoreEditor, liveScoreEntry } from '../live-scoring.mjs';
import { openScoreHistory } from '../score-history.mjs';
const entries = [];
let game = { status: 'scheduled', homeName: 'Home Club', awayName: 'Away Club', scorekeeperId: 'test' };
document.getElementById('open').onclick = () => openScoreEditor(game, async values => {
  const { patch, entry } = liveScoreEntry('fixture', game, values, { uid: 'test', role: 'scorekeeper' }, game.scoreRevision ?? 0);
  entries.push(entry); game = { ...game, ...patch };
  document.getElementById('result').textContent = `${game.status}: ${game.homeScore}-${game.awayScore}, ${game.half} ${game.inning}, revision ${game.scoreRevision}; bases: ${JSON.stringify(game.bases)}`;
});
document.getElementById('history').onclick = () => openScoreHistory(game, entries);
</script>
</body>
</html>
